services:
  searxng:
    image: searxng/searxng:latest
    container_name: dork-atlas-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: dork-atlas-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DORK_ATLAS_ENVIRONMENT=production
      - DORK_ATLAS_SEARXNG_URL=http://searxng:8080
      - DORK_ATLAS_DATABASE_URL=sqlite+aiosqlite:///data/dork_atlas.db
    volumes:
      - dork_atlas_data:/app/data
    depends_on:
      - searxng

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: dork-atlas-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dork_atlas_data:
